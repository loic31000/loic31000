name: Custom Commit Counter

on:
  schedule:
    - cron: "30 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate custom commit counter
        env:
          GH_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          GITHUB_USER: loic31000
        run: bash .github/scripts/update-commit-count.sh

      - name: Commit updated counter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/commit-count.svg

          if git diff --cached --quiet; then
            echo "Commit counter has not changed."
            exit 0
          fi

          git commit -m "chore: update custom commit counter"

          git pull --rebase origin main
          git push origin main
