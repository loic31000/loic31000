name: Public Projects Catalog

on:
  schedule:
    - cron: "15 3 * * 1" # Weekly, Monday at 03:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate catalog of public repositories only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update-projects.py

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add PROJECTS.md

          if git diff --cached --quiet; then
            echo "Public project catalog is already current."
            exit 0
          fi

          git commit -m "docs: refresh public project catalog"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
