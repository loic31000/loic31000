name: Cleanup Obsolete Branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-obsolete-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branches=(
            "feat/profile-stats-v2"
            "feat/profile-stats-branches-pr-issues"
            "fix/profile-stats-cache-busting"
          )

          for branch in "${branches[@]}"; do
            echo "Checking ${branch}..."

            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
